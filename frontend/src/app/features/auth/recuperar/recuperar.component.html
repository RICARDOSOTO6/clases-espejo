<div class="auth-layout">
  <aside class="auth-hero">
    <div class="auth-hero-inner">
      <div class="auth-logo-chip">
        <img [src]="logo()" alt="Logo de Clases Espejo" />
      </div>
      <p class="auth-hero-lema">{{ lema() }}</p>
      <p class="auth-hero-tag">{{ descripcion() }}</p>
    </div>
  </aside>

  <main class="auth-main">
    <section class="auth-card">
      <h1 class="auth-title">Recuperar contraseña</h1>
      <p class="auth-subtitle">
        Escribe tu correo y te enviaremos un enlace para crear una nueva.
      </p>

      @if (enviado()) {
        <div class="alert alert-success" role="status">
          {{ mensaje() }}
        </div>
      }

      @if (!enviado()) {
        <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
          <div class="form-field">
            <label for="correo">Correo</label>
            <input
              id="correo"
              type="email"
              formControlName="correo"
              placeholder="tucorreo@institucion.edu"
              autocomplete="email"
            />
            @if (mensajeDe(); as msg) {
              <p class="field-error">{{ msg }}</p>
            }
          </div>

          @if (error()) {
            <div class="alert alert-error" role="alert">{{ error() }}</div>
          }

          <button
            type="submit"
            class="btn btn-primary"
            [disabled]="form.invalid || loading()"
          >
            @if (loading()) {
              <span class="spinner" aria-hidden="true"></span>
            }
            {{ loading() ? 'Enviando…' : 'Enviar enlace' }}
          </button>
        </form>
      }

      <p class="auth-alt">
        <a routerLink="/login">← Volver a iniciar sesión</a>
      </p>
    </section>
  </main>
</div>
