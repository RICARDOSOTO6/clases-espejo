name: clases-conjuntas

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-clasesconjuntas}
      POSTGRES_USER: ${POSTGRES_USER:-clasesconjuntas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env.docker}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-clasesconjuntas} -d ${POSTGRES_DB:-clasesconjuntas}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env.docker
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-clasesconjuntas}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-clasesconjuntas}?schema=public
    ports:
      - "3000:3000"
    volumes:
      - uploads:/app/backend/uploads
      - respaldos:/app/backend/respaldos

volumes:
  db-data:
  uploads:
  respaldos:
